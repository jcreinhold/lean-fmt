# Cutting a lean-fmt release.
#
# There are no prebuilt binaries. lean-fmt is taken as a Lake dependency and built from source
# against the consumer's own toolchain — which a downloaded binary could never have served for the
# compiler plugin or the cache facet, since a plugin is a shared library loaded into the consumer's
# compiler. So a release is a tag, a gate, and release notes; nothing is packaged or uploaded.
#
# The tag *is* the compatibility contract: it is spelled exactly as the `lean-toolchain` this tree
# was built against, so a consumer requires the tag matching their own toolchain and never consults
# a table. `verify-tag` below is what makes that contract true rather than a convention — tag
# `v4.34.0` on a tree still pinned to an rc and every consumer inherits the mismatch, with no error
# until something strange happens deep in their build.
#
# The four-platform gate survives the binaries it used to build. Consumers now compile lean-fmt
# themselves, so a platform-shaped failure lands on them at build time rather than on a tarball
# here; running the suites on each platform is what keeps that from being their discovery.
#
# Triggered two ways: pushing a `v*` tag, or manual dispatch with an existing tag name.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to gate and publish (e.g. v4.34.0-rc1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # Fast, and first: a mismatch here invalidates every leg below, so spend a runner-second on it
  # before spending four full test runs.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: tag names the toolchain
        run: |
          toolchain="$(cut -d: -f2 lean-toolchain | tr -d '[:space:]')"
          if [ "$TAG" != "$toolchain" ]; then
            echo "tag $TAG does not name this tree's toolchain ($toolchain)" >&2
            echo "the tag is the compatibility contract; they must be spelled identically" >&2
            exit 1
          fi
          # The package version carries the same string without the leading `v`. The boundary
          # suite's `package-identity` case ties `LeanFmt/Basic.lean` to the lakefile, so pinning
          # the lakefile here pins what `--version` prints too.
          version="$(sed -n 's/.*version := v!"\(.*\)".*/\1/p' lakefile.lean)"
          if [ "$version" != "${toolchain#v}" ]; then
            echo "lakefile version $version does not match toolchain ${toolchain#v}" >&2
            exit 1
          fi
          echo "tag $TAG, toolchain $toolchain, version $version"

  gate:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: leanprover/lean-action@v1
        with:
          # Build and lint only: auto-config would also run `lake test` inside the action, and
          # the explicit step below would then run the whole suite phase a second time.
          test: "false"

      # Core count is a test input, not trivia: `lean` sizes its task pool from it, and a fixture
      # that needs four threads deadlocks on a three-core runner. Three release runs were spent
      # finding that out from logs that never recorded the machine. Printed on every leg, passing
      # or not, so the next comparison is between numbers rather than guesses.
      - name: runner facts
        run: |
          uname -sm
          if [ "$(uname -s)" = "Darwin" ]; then
            echo "cores=$(sysctl -n hw.logicalcpu) memMB=$(( $(sysctl -n hw.memsize) / 1048576 ))"
          else
            echo "cores=$(nproc) memMB=$(free -m | awk '/Mem:/ {print $2}')"
          fi
          df -m . | awk 'NR==2 {print "diskAvailMB=" $4}'

      # The full gate runs here, once, on every platform leg — a release stays thorough even
      # where CI splits the registry across jobs for speed. Epoch forensics are on so a moved
      # cache epoch names its component in the failure digest (ubuntu-22.04 grew a second
      # index here that no other platform grew).
      - name: test
        run: lake test
        env:
          LEAN_FMT_DEBUG_CACHE: "1"

      # What a consumer's `lake exe lean-fmt` will do on this platform, exercised through the real
      # frontend child rather than argument parsing alone.
      - name: build and smoke test
        run: |
          lake build lean-fmt artifactExtractor
          .lake/build/bin/lean-fmt --version
          .lake/build/bin/lean-fmt check LeanFmt.lean

  publish:
    needs: gate
    runs-on: ubuntu-latest

    steps:
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job: without a repository hint, gh infers the repo from a git
          # remote that does not exist here and dies with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release view "$TAG"
