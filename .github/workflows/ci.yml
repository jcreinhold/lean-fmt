# Continuous integration for lean-fmt.
#
# test: every push to main and every pull request, split across four jobs — one for the unit
# tier and three for the suite registry, partitioned by the runner's own `--part INDEX/COUNT`,
# so a suite added to the registry joins a part without a workflow edit. The runner deals each
# lane separately: workspace suites serialize inside a job, so an even deal of them is what
# balances the jobs' wall times. lean-action builds and lints (`lake lint` runs the formatter as
# its own lint driver, which is what lean-action probes for) but does not run `lake test`
# itself: its auto-config would, and the explicit steps would then repeat it — until the
# `test: "false"` input, CI ran the whole suite phase twice per job. Suites that need a tool the
# runner lacks (Neovim, uv) skip rather than fail.
#
# slow: the flake-hunt — the default set twice (a flake's signature is that it does not
# survive repetition) plus the minutes-long stream, performance, downstream, ci,
# lsp-acceptance, editor, incremental, and security-bench suites — weekly on a schedule and on
# manual dispatch. docs/flaky-tests.md tracks incremental's open Linux root-cause.
#
# next-toolchain: the early-warning probe, on the same schedule. Lean's ABI is not stable across
# releases and this repository vendors a region of `Std.Format`, so a bump is an event to test
# rather than a version-string edit — docs/toolchain-upgrade.md is the checklist. This job asks
# the three questions a bump turns on, against the newest published release with release
# candidates included, which is the whole point: the answer is worth more before the release
# than after. It reports rather than adapts, and needs no long-lived adaptation branch —
# `lean-toolchain` is rewritten in the runner and never committed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The flake-hunt: weekly, two repetitions of the default set plus the slow suites, because
    # an intermittent failure nobody exercises is one everybody ships.
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A newer push supersedes a run still in flight on the same ref.
concurrency:
  # The event name keeps the weekly/manual flake-hunt out of the push group: they share a ref,
  # and sharing a group meant every dispatch cancelled a push run and every push cancelled the
  # hunt, with nothing ever completing. Pushes still supersede pushes, which is the point.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # incremental stays slow-tagged for wall time, not fragility: the retention bomb that
        # OOMed runners was its in-process oracle stacking import environments, fixed with a
        # child-process oracle plus a targeted fixture import closure (peak ~2.5 GB at any
        # thread count, gated by the suite's own thread-ratio check). It runs in the
        # flake-hunt's slow list; docs/flaky-tests.md has the arc.
        part: [unit, "1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          test: "false"
      - name: unit tier
        if: matrix.part == 'unit'
        run: lake test -- --unit-only
        # A suite part normally finishes well under ten minutes; a hung runner otherwise holds
        # the concurrency group hostage for the six-hour default, and did exactly that once.
        timeout-minutes: 10
      - name: suite part ${{ matrix.part }}
        if: matrix.part != 'unit'
        # --jobs 2, not the default 4: four concurrent suites each spawning frontend children
        # exhausts the 16 GB runner — the shutdown-signal kills and silent wedges all landed in
        # that window, and an unresponsive agent holds the concurrency group hostage. Halving
        # the suite count halves the envelope; the wall-time cost is a few minutes per part.
        # The TELEM lines are the envelope made visible: memory and disk headroom every 15 s,
        # interleaved with the suite heartbeats, so the sample before a kill names the resource.
        run: |
          (while true; do
            echo "TELEM $(date +%H:%M:%S) memAvailMB=$(free -m | awk '/Mem:/ {print $7}') diskAvailMB=$(df -m / | awk 'NR==2 {print $4}')"
            sleep 15
          done) &
          TELEM_PID=$!
          lake test -- --skip-unit --part "${{ matrix.part }}" --jobs 2
          CODE=$?
          kill $TELEM_PID 2>/dev/null || true
          exit $CODE
        env:
          # Two suites at a time is only half the envelope: each lean-fmt invocation defaults
          # to hardware-concurrency frontend children, each holding a full project environment
          # (~1-2 GB). The telemetry showed 14.8 GB falling to 2.2 GB in 75 s in exactly that
          # configuration. Capping the children at two caps a part at four heavyweight
          # processes, and `resolveWorkers` reads this variable before the hardware default.
          # DEBUG_CACHE is epoch forensics: a moved cache epoch names its component in the
          # failure digest instead of hiding behind a changed digest.
          LEAN_NUM_THREADS: "2"
          LEAN_FMT_DEBUG_CACHE: "1"
        timeout-minutes: 20

  slow:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # The weekly flake-hunt and the manual complete-set run. The default set runs twice: a
    # flake's signature is that it does not survive repetition. The slow suites are then named
    # explicitly rather than run through --all, so incremental — which exhausts a 16 GB runner
    # by design, at the 8 GiB contract stop — is isolated in its own step with its own timeout.
    # docs/flaky-tests.md tracks its open Linux root-cause.
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          test: "false"
      - name: default set, twice
        run: |
          (while true; do
            echo "TELEM $(date +%H:%M:%S) memAvailMB=$(free -m | awk '/Mem:/ {print $7}') diskAvailMB=$(df -m / | awk 'NR==2 {print $4}')"
            sleep 15
          done) &
          TELEM_PID=$!
          lake test -- --skip-unit --jobs 2 && lake test -- --skip-unit --jobs 2
          CODE=$?
          kill $TELEM_PID 2>/dev/null || true
          exit $CODE
        env:
          LEAN_NUM_THREADS: "2"
          LEAN_FMT_DEBUG_CACHE: "1"
        timeout-minutes: 40
      - name: slow suites
        run: lake test -- --skip-unit --suites ci downstream editor incremental performance stream security-bench lsp-acceptance --jobs 2
        env:
          LEAN_NUM_THREADS: "2"
          LEAN_FMT_DEBUG_CACHE: "1"
        timeout-minutes: 60

  next-toolchain:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read by `bump` and `adaptation-alert` below. The verdict step's own pass/fail is the same
    # predicate `bump` gates on; these outputs are what let a second job act on it instead of a
    # person reading a step summary.
    outputs:
      moved: ${{ steps.candidate.outputs.moved }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      pinned: ${{ steps.candidate.outputs.pinned }}
      build: ${{ steps.build.outcome }}
      changed: ${{ steps.output.outputs.changed }}
      drift: ${{ steps.region.outputs.drift }}
    steps:
      - uses: actions/checkout@v5

      # Release candidates are included deliberately: an RC is the window in which an upstream
      # change can still be questioned, and the one after which it can only be absorbed.
      - name: resolve the candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(tr -d '[:space:]' < lean-toolchain)
          tag=$(gh api repos/leanprover/lean4/releases --jq 'map(select(.draft | not)) | .[0].tag_name')
          candidate="leanprover/lean4:$tag"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$candidate" ]; then
            echo "moved=no" >> "$GITHUB_OUTPUT"
            echo "Pinned to the newest release ($pinned). Nothing to probe." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "moved=yes" >> "$GITHUB_OUTPUT"
            echo "## Probing \`$candidate\` against pinned \`$pinned\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Signal one, and the only one that predicts an output fork: canonical layout derives from
      # the `Std.Format` machine `LeanFmt/NativeFormat.lean` vendors, and the boundary suite's
      # vendored-provenance case pins the reviewed region. Read upstream over HTTP rather than
      # from an installed toolchain so this answers in seconds and stays readable when the build
      # below fails — the two failure modes are independent and a bump wants both answers.
      - name: vendored region drift
        id: region
        if: steps.candidate.outputs.moved == 'yes'
        # An upstream path that moved would otherwise 404 under `curl -f` and take the build and
        # output signals down with it, which is the opposite of reading them independently.
        continue-on-error: true
        run: |
          tag="${{ steps.candidate.outputs.candidate }}"
          tag="${tag#leanprover/lean4:}"
          curl -sSfL "https://raw.githubusercontent.com/leanprover/lean4/$tag/src/Init/Data/Format/Basic.lean" -o upstream-format.lean
          awk '/^inductive Format\.FlattenBehavior where$/{f=1} f{print} f&&/State\.out <\| act\.run \(State\.mk "" column\) \|>\.snd/{exit}' upstream-format.lean > candidate-region.txt
          # The fixture's first three lines are its provenance header, not region content.
          tail -n +4 tests/fixtures/boundary/native-format-region.txt > pinned-region.txt
          if [ ! -s candidate-region.txt ]; then
            echo "drift=markers-missing" >> "$GITHUB_OUTPUT"
            echo "The region markers no longer match upstream; re-anchor them in \`tests/Suites/Boundary.lean\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if diff -u pinned-region.txt candidate-region.txt > region.diff; then
            echo "drift=none" >> "$GITHUB_OUTPUT"
            echo "Vendored \`Std.Format\` region: unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "drift=$(grep -c '^[+-][^+-]' region.diff) lines" >> "$GITHUB_OUTPUT"
            { echo "Vendored \`Std.Format\` region moved:"
              echo '```diff'
              head -80 region.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: pin the candidate
        if: steps.candidate.outputs.moved == 'yes'
        run: echo "${{ steps.candidate.outputs.candidate }}" > lean-toolchain

      # Signal two. A rename breaks here, which is the good case; continue-on-error so a broken
      # build still reaches the verdict with the region answer beside it.
      - name: build under the candidate
        id: build
        if: steps.candidate.outputs.moved == 'yes'
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          test: "false"

      # Signal three: `lake lint` above reports rule findings, which is a different question.
      # This one asks whether canonical bytes moved, over the tree this repository keeps
      # format-clean. It is a count, not a wall time, so it means the same thing on any runner.
      - name: canonical output
        id: output
        if: steps.candidate.outputs.moved == 'yes' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          report=$(.lake/build/bin/lean-fmt format --check 2>&1) || true
          echo "$report"
          changed=$(printf '%s\n' "$report" | sed -n 's/.*changed=\([0-9]*\).*/\1/p' | tail -1)
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      # Red means the next release needs work from you. Region drift alone is not red: some
      # lands in nearly every release, and a job that fails every time is one nobody reads.
      - name: verdict
        if: always() && steps.candidate.outputs.moved == 'yes'
        run: |
          build="${{ steps.build.outcome }}"
          changed="${{ steps.output.outputs.changed }}"
          drift="${{ steps.region.outputs.drift }}"
          { echo ""
            echo "| signal | result |"
            echo "| --- | --- |"
            echo "| builds | $build |"
            echo "| vendored region | ${drift:-not determined} |"
            echo "| files whose canonical bytes move | ${changed:-not reached} |"
            echo ""
            echo "Adaptation checklist: \`docs/toolchain-upgrade.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          [ "$build" = "success" ] || fail=1
          [ "${changed:-1}" = "0" ] || fail=1
          exit $fail

  # A bump the probe found mechanical — it builds, and not one canonical byte moves — has nothing
  # left for a person to decide, so it arrives as a pull request rather than as a note in a step
  # summary somebody reads next month. The predicate is the verdict step's own, spelled out in
  # `if:` because a job cannot inherit another's exit status.
  #
  # The gate runs *here* rather than on the pull request: GitHub does not fire workflows for a PR
  # opened by `GITHUB_TOKEN`, so a PR from this job would otherwise sit with no checks at all. The
  # body records what ran, and pushing any commit to the branch starts ordinary CI on top.
  bump:
    needs: next-toolchain
    if: >-
      always() && needs.next-toolchain.outputs.moved == 'yes' &&
      needs.next-toolchain.outputs.build == 'success' &&
      needs.next-toolchain.outputs.changed == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      CANDIDATE: ${{ needs.next-toolchain.outputs.candidate }}
      PINNED: ${{ needs.next-toolchain.outputs.pinned }}
      DRIFT: ${{ needs.next-toolchain.outputs.drift }}
    steps:
      - uses: actions/checkout@v5

      - name: move every version site
        id: move
        run: |
          tag="${CANDIDATE#leanprover/lean4:}"
          version="${tag#v}"
          branch="bump/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          echo "$CANDIDATE" > lean-toolchain

          # docs/manual is a second Lake package pinned to the same toolchain, and its verso rev
          # must equal that toolchain too — pages.yml fails when either lags, which is a bump that
          # documents a compiler the code no longer uses. Verso tags on Lean's own cadence, so it
          # may not have this candidate yet: move the pair only when the tag really exists, rather
          # than writing a rev that resolves to nothing.
          manual=skipped
          if git ls-remote --exit-code --tags \
               https://github.com/leanprover/verso "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$CANDIDATE" > docs/manual/lean-toolchain
            sed -i "s|^rev = \"v[^\"]*\"|rev = \"$tag\"|" docs/manual/lakefile.toml
            manual=moved
          fi
          echo "manual=$manual" >> "$GITHUB_OUTPUT"

          sed -i "s|version := v!\"[^\"]*\"|version := v!\"$version\"|" lakefile.lean
          # The literal sits on the line after the signature, so address the signature and edit
          # the next line: a bare quote-substitution would rewrite the docstring above it.
          sed -i "/^def version : String :=$/{n;s|\".*\"|\"$version\"|;}" LeanFmt/Basic.lean

          # Example pins only. The historical sentence in README.md names v0.7.1 and its Lean in
          # prose, matches none of these patterns, and must not move.
          sed -i "s|@ \"v[^\"]*\"|@ \"$tag\"|g" README.md docs/ci.md
          sed -i "s|--branch v[^ ]*|--branch $tag|" README.md
          sed -i "s|# leanprover/lean4:v[^ ]*|# leanprover/lean4:$tag|" README.md

          python3 - "$version" <<'PY'
          import datetime, pathlib, sys
          version = sys.argv[1]
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()
          head, sep, rest = text.partition("\n## ")
          stub = (
              f"\n## {version} — {datetime.date.today().isoformat()}\n\n"
              "### Changed\n\n"
              "- Serves Lean `v" + version + "`. No behaviour changed: the probe found this bump "
              "mechanical, meaning lean-fmt built against it and not one canonical byte moved "
              "across this repository.\n"
          )
          path.write_text(head + stub + sep + rest)
          PY

          git diff --stat

      - uses: leanprover/lean-action@v1
        with:
          test: "false"

      # The whole gate, because nothing else will run one on this branch. Not `--all`: the slow
      # suites are the weekly hunt's job, and a bump that breaks one of those breaks a fast one
      # first in every case this probe has seen.
      - name: test
        run: lake test

      - name: open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.move.outputs.tag }}"
          branch="${{ steps.move.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          paths="lean-toolchain lakefile.lean LeanFmt/Basic.lean README.md docs/ci.md CHANGELOG.md"
          if [ "${{ steps.move.outputs.manual }}" = "moved" ]; then
            paths="$paths docs/manual/lean-toolchain docs/manual/lakefile.toml"
          fi
          # Explicit pathspecs: this repository is shared with concurrent sessions and a bare
          # commit would sweep up whatever else is in the tree.
          git commit -m "Serve Lean $tag" -- $paths
          git push -f origin "$branch"
          # Via a file, for the same reason the alert below uses one: prose inside a command
          # substitution is one apostrophe away from a syntax error.
          cat > pr-body.md <<EOF
          Moves \`lean-toolchain\` from \`$PINNED\` to \`$CANDIDATE\`, and every site that has to
          agree with it: \`lakefile.lean\`, \`LeanFmt/Basic.lean\`, the example pins in
          \`README.md\` and \`docs/ci.md\`, \`docs/manual/lean-toolchain\`, and a CHANGELOG stub.

          The probe found this bump **mechanical**: lean-fmt builds under \`$CANDIDATE\` and not
          one canonical byte moves across this repository. Vendored \`Std.Format\` region:
          \`${DRIFT:-not determined}\`.

          \`docs/manual\`: **${{ steps.move.outputs.manual }}**. It moves only when verso has
          tagged \`$tag\`; when it is skipped, verso has not, and the manual has to follow in a
          second commit or \`pages.yml\` will fail on its pin check after this merges.

          Gated in [the run that opened this](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          — \`lake build\`, \`lake lint\` and \`lake test\` all green there. GitHub does not start
          workflows for a pull request opened by \`GITHUB_TOKEN\`, so no checks appear below;
          push any commit to \`$branch\` to start ordinary CI on top of it.

          Merging this does **not** release. Tagging is a separate, human step —
          \`.claude/skills/release-lean-fmt/SKILL.md\`.
          EOF
          gh pr view "$branch" >/dev/null 2>&1 \
            || gh pr create --base main --head "$branch" \
                 --title "Serve Lean $tag" --body-file pr-body.md

  # The probe went red, which means a person or an agent has to adapt something. The alert is a
  # GitHub issue rather than a failed job: a failure is a red mark that ages out of anyone's
  # attention in a week, and an issue is a work item that can be assigned, discussed, and handed
  # to whichever tool is doing the adaptation. Deliberately does not start that work itself.
  #
  # One issue per candidate, created once: the probe re-runs weekly and re-reporting the same
  # candidate every Monday is how an alert becomes noise nobody reads.
  adaptation-alert:
    needs: next-toolchain
    if: >-
      always() && needs.next-toolchain.outputs.moved == 'yes' &&
      (needs.next-toolchain.outputs.build != 'success' ||
       needs.next-toolchain.outputs.changed != '0')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ needs.next-toolchain.outputs.candidate }}
      PINNED: ${{ needs.next-toolchain.outputs.pinned }}
      BUILD: ${{ needs.next-toolchain.outputs.build }}
      CHANGED: ${{ needs.next-toolchain.outputs.changed }}
      DRIFT: ${{ needs.next-toolchain.outputs.drift }}
    steps:
      - name: open one issue for this candidate
        run: |
          title="Toolchain probe red: $CANDIDATE"
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            echo "already tracked as #$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create toolchain-probe --color BFD4F2 \
            --description "Raised by the next-toolchain probe" 2>/dev/null || true
          # Via a file, not `--body "$(cat <<EOF ...)"`: an apostrophe in the prose ends the
          # command substitution and the step dies on syntax rather than on anything real.
          cat > issue-body.md <<EOF
          \`$CANDIDATE\` is published and lean-fmt does not yet serve it. Pinned: \`$PINNED\`.

          | signal | result |
          | --- | --- |
          | builds | \`$BUILD\` |
          | vendored \`Std.Format\` region | \`${DRIFT:-not determined}\` |
          | files whose canonical bytes move | \`${CHANGED:-not reached}\` |

          [The probe run.](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          Checklist: \`docs/toolchain-upgrade.md\`. Procedure: the \`bump-toolchain\` skill.

          A mechanical bump would have arrived as a pull request instead, so something here needs
          judgement: either lean-fmt no longer builds against upstream, or it builds and the bytes
          it produces have moved. Those are different problems — read the run's step summary before
          starting, it separates them.

          Nothing is running against this. Closing it without a bump is a decision to skip the
          release; the probe will not raise it again for this candidate.
          EOF
          gh issue create --title "$title" --label toolchain-probe --body-file issue-body.md

