# CI placeholder for lean-fmt. Filled out in the release-packaging prompt; kept here so the
# workflow surface exists from the first commit. The job names match scripts/*.sh.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  lean:
    name: lean (lake build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # elan/toolchain setup is added with the runtime-packaging prompt.
      - name: lake build
        run: lake -d lean build
