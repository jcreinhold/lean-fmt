# Continuous integration for lean-fmt.
#
# test: every push to main and every pull request, sharded four ways — one job for the unit tier
# and three for the suite registry, partitioned by the runner's own `--shard INDEX/COUNT`, so a
# suite added to the registry joins a shard without a workflow edit. lean-action builds and lints
# (`lake lint` runs the formatter as its own lint driver, which is what lean-action probes for)
# but does not run `lake test` itself: its auto-config would, and the explicit sharded steps
# would then repeat it — until the `test: "false"` input, CI ran the whole suite phase twice per
# job. Suites that need a tool the runner lacks (Neovim, uv) skip rather than fail.
#
# slow: the complete set — the minutes-long stream, performance, downstream, ci, lsp-acceptance,
# editor, and security-bench suites included — on manual dispatch only, because it costs minutes
# rather than seconds.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a run still in flight on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, "1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          test: "false"
      - name: unit tier
        if: matrix.shard == 'unit'
        run: lake test -- --unit-only
      - name: suite shard ${{ matrix.shard }}
        if: matrix.shard != 'unit'
        run: lake test -- --skip-unit --shard ${{ matrix.shard }}

  slow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          test: "false"
      - run: lake test -- --all
